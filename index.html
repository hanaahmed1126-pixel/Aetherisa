<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherisa AI Studio — Strict Attention Edition</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f3f4f6;
      --border: #1e293b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h2 { margin: 0 0 0.5rem 0; font-size: 1.25rem; color: #fff; }
    label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
    textarea, select, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    textarea:focus, select:focus, input:focus { outline: 1px solid var(--accent); }
    .row { display: flex; gap: 0.75rem; }
    .row > div { flex: 1; }
    .toggle-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .toggle-box input { width: auto; cursor: pointer; }
    button.btn-primary {
      background: var(--accent);
      color: #0b0f19;
      font-weight: bold;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .viewport {
      background: #070a12;
      border: 1px dashed var(--border);
      border-radius: 8px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .viewport img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .viewport .placeholder { color: #64748b; font-size: 0.9rem; text-align: center; padding: 1rem; }
    .status { font-family: monospace; font-size: 0.85rem; color: var(--accent); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem; margin-top: 1rem; }
    .gallery img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); }
    .gallery img:hover { border-color: var(--accent); }
    .download-btn {
      display: none;
      background: #10b981;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- INPUT CONTROLS -->
    <div class="panel">
      <h2>Aetherisa Studio Settings</h2>

      <div>
        <label>Detailed Prompt (Write as much as you want!)</label>
        <textarea id="prompt" rows="5" placeholder="Describe every detail: background, main subjects, precise colors, weather, lighting..."></textarea>
      </div>

      <div class="toggle-box" onclick="document.getElementById('strictAttention').click()">
        <input type="checkbox" id="strictAttention" checked onclick="event.stopPropagation()">
        <div>
          <label style="color:#fff; cursor:pointer;">Strict Prompt Attention (De-Truncator)</label>
          <div style="font-size:0.75rem; color:#64748b;">Weights sentence blocks so the AI doesn't skip later words.</div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Model Engine</label>
          <select id="modelSelect">
            <option value="flux" selected>Flux.1 (Best for Long Detailed Prompts)</option>
            <option value="turbo">SDXL Turbo (Ultra Fast)</option>
          </select>
        </div>
        <div>
          <label>Aspect Ratio</label>
          <select id="aspectSelect" onchange="updateDimensions()">
            <option value="1024x1024">Square (1:1)</option>
            <option value="1280x720">Landscape (16:9)</option>
            <option value="720x1280">Portrait (9:16)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Width</label>
          <input type="number" id="width" value="1024" readonly>
        </div>
        <div>
          <label>Height</label>
          <input type="number" id="height" value="1024" readonly>
        </div>
      </div>

      <div>
        <label>Seed (-1 = Random)</label>
        <input type="number" id="seed" value="-1">
      </div>

      <button class="btn-primary" id="genBtn" onclick="generateImage()">Generate Image</button>
      <div class="status" id="status">Ready. Write your detailed prompt above!</div>
    </div>

    <!-- DISPLAY VIEWPORT & GALLERY -->
    <div class="panel">
      <h2>Output Canvas</h2>
      <div class="viewport">
        <img id="resultImg" alt="Generated Output">
        <div class="placeholder" id="placeholder">Your rendered image will appear here.</div>
      </div>

      <a id="downloadBtn" class="download-btn" target="_blank" download="aetherisa_image.png">Download HD Image</a>

      <h3>Session History</h3>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>

  <script>
    function updateDimensions() {
      const [w, h] = document.getElementById('aspectSelect').value.split('x');
      document.getElementById('width').value = w;
      document.getElementById('height').value = h;
    }

    // STRICT ATTENTION ENGINE: Breaks down prompt into weighted chunks
    function processStrictAttention(rawPrompt) {
      // Clean up whitespace
      const cleanText = rawPrompt.trim();
      if (!cleanText) return "";

      // Split into sentences / major clauses
      const clauses = cleanText.split(/[\.\n;]+/).filter(c => c.trim().length > 0);

      if (clauses.length <= 1) {
        // Single sentence: add emphasis to key detail phrases
        return `(${cleanText}:1.2), hyper-detailed, intricate precision, highly focused, all elements rendered`;
      }

      // Multi-sentence prompt: Weight each clause individually so the end isn't skipped
      const weightedClauses = clauses.map((clause, index) => {
        const trimmed = clause.trim();
        // Give slightly higher weight boost (1.3 to 1.4) to later sentences to prevent truncation
        const weight = (1.2 + (index * 0.05)).toFixed(2);
        return `(${trimmed}:${weight})`;
      });

      return weightedClauses.join(", ") + ", hyper-detailed, complete scene fidelity";
    }

    async function generateImage() {
      const rawPrompt = document.getElementById('prompt').value;
      if (!rawPrompt.trim()) return alert("Please enter a prompt!");

      const useStrict = document.getElementById('strictAttention').checked;
      const model = document.getElementById('modelSelect').value;
      const width = document.getElementById('width').value;
      const height = document.getElementById('height').value;
      let seed = parseInt(document.getElementById('seed').value);

      const btn = document.getElementById('genBtn');
      const status = document.getElementById('status');
      const img = document.getElementById('resultImg');
      const placeholder = document.getElementById('placeholder');
      const downloadBtn = document.getElementById('downloadBtn');

      btn.disabled = true;
      status.innerText = "Applying strict attention rules and sending to model...";

      if (seed === -1) {
        seed = Math.floor(Math.random() * 100000000);
      }

      // Process prompt through Attention Engine if enabled
      const finalPrompt = useStrict ? processStrictAttention(rawPrompt) : rawPrompt;
      const encodedPrompt = encodeURIComponent(finalPrompt);

      // Route through Pollinations API with Flux model & direct parameters
      const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&model=${model}&nologo=true`;

      const tempImg = new Image();
      tempImg.src = imageUrl;

      tempImg.onload = function() {
        img.src = imageUrl;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        status.innerText = `Done! Model: ${model.toUpperCase()} | Seed: ${seed}`;
        btn.disabled = false;

        // Setup download link
        downloadBtn.href = imageUrl;
        downloadBtn.style.display = 'block';

        // Add to Session Gallery
        addToGallery(imageUrl);
      };

      tempImg.onerror = function() {
        status.innerText = "Error fetching image. Try simplifying the prompt slightly.";
        btn.disabled = false;
      };
    }

    function addToGallery(url) {
      const gallery = document.getElementById('gallery');
      const thumb = document.createElement('img');
      thumb.src = url;
      thumb.onclick = () => {
        document.getElementById('resultImg').src = url;
        document.getElementById('downloadBtn').href = url;
      };
      gallery.prepend(thumb);
    }
  </script>
</body>
</html>
