<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherisa - AI Creation Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 550px;
      width: 100%;
      border: 1px solid #334155;
    }
    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #38bdf8;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
    }
    
    label { font-size: 0.875rem; font-weight: 600; color: #94a3b8; display: block; margin-top: 1rem; margin-bottom: 0.25rem; }
    
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid #38bdf8; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    
    button.action-btn {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 1.25rem;
      transition: background-color 0.2s;
    }
    button.action-btn:hover { background-color: #0369a1; }
    button.action-btn:disabled { background-color: #475569; cursor: not-allowed; }

    #downloadBtn {
      background-color: #10b981;
      display: none;
      margin-top: 0.75rem;
    }
    #downloadBtn:hover { background-color: #059669; }

    #mediaContainer {
      margin-top: 1.5rem;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px dashed #334155;
    }
    img, video { max-width: 100%; height: auto; border-radius: 8px; display: none; }
    .loading { display: none; color: #94a3b8; text-align: center; font-size: 0.9rem; padding: 1rem; }

    .token-box {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Aetherisa</h2>
    
    <div class="token-box">
      <label for="hfTokenInput">Hugging Face Token (for Video Generation)</label>
      <input type="password" id="hfTokenInput" placeholder="Paste hf_... token here" onchange="saveToken()">
    </div>

    <label for="promptInput">Prompt Description</label>
    <input type="text" id="promptInput" placeholder="Describe what you want to create..." onkeypress="handleKeyPress(event)">

    <div class="grid">
      <div>
        <label for="typeSelect">Output Format</label>
        <select id="typeSelect">
          <option value="image">Image / Photo</option>
          <option value="video">Video Animation (Hugging Face)</option>
        </select>
      </div>
      <div>
        <label for="sizeSelect">Aspect Ratio</label>
        <select id="sizeSelect">
          <option value="512x512">Square (1:1)</option>
          <option value="768x512">Landscape (3:2)</option>
          <option value="512x768">Portrait (2:3)</option>
        </select>
      </div>
    </div>

    <button class="action-btn" id="genBtn" onclick="generateMedia()">Generate Media</button>

    <div id="mediaContainer">
      <p id="loadingText" class="loading">Aetherisa is working on your creation...</p>
      <img id="resultImage" src="" alt="AI Output Image">
      <video id="resultVideo" controls autoplay loop playsinline></video>
    </div>

    <button class="action-btn" id="downloadBtn" onclick="downloadMedia()">Download Output</button>
  </div>

  <script>
    // Load saved token from browser local storage on startup
    window.onload = () => {
      const savedToken = localStorage.getItem('aetherisa_hf_token');
      if (savedToken) {
        document.getElementById('hfTokenInput').value = savedToken;
      }
    };

    function saveToken() {
      const token = document.getElementById('hfTokenInput').value.trim();
      localStorage.setItem('aetherisa_hf_token', token);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') generateMedia();
    }

    async function generateMedia() {
      const prompt = document.getElementById('promptInput').value.trim();
      const type = document.getElementById('typeSelect').value;
      const imgTag = document.getElementById('resultImage');
      const vidTag = document.getElementById('resultVideo');
      const loadingText = document.getElementById('loadingText');
      const genBtn = document.getElementById('genBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const hfToken = document.getElementById('hfTokenInput').value.trim();

      if (!prompt) {
        alert("Please enter a prompt first!");
        return;
      }

      if (type === 'video' && !hfToken) {
        alert("Please paste your Hugging Face Token in the box at the top to generate videos!");
        return;
      }

      saveToken();

      imgTag.style.display = 'none';
      vidTag.style.display = 'none';
      downloadBtn.style.display = 'none';
      loadingText.style.display = 'block';
      genBtn.disabled = true;

      const [width, height] = document.getElementById('sizeSelect').value.split('x');
      const encodedPrompt = encodeURIComponent(prompt);
      const randomSeed = Math.floor(Math.random() * 999999);

      if (type === 'image') {
        loadingText.innerText = "Aetherisa is generating your photo...";
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${randomSeed}&model=flux&nologo=true`;

        imgTag.onload = () => {
          loadingText.style.display = 'none';
          imgTag.style.display = 'block';
          downloadBtn.style.display = 'block';
          genBtn.disabled = false;
        };
        imgTag.onerror = () => {
          loadingText.innerText = "Failed to load image. Please try again.";
          genBtn.disabled = false;
        };
        imgTag.src = imageUrl;

      } else {
        // Video Generation via Hugging Face API
        loadingText.innerText = "Aetherisa is asking Hugging Face to render your video... (20-40s)";

        try {
          const response = await fetch(
            "https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b",
            {
              headers: { 
                Authorization: `Bearer ${hfToken}`,
                "Content-Type": "application/json"
              },
              method: "POST",
              body: JSON.stringify({ inputs: prompt }),
            }
          );

          if (!response.ok) {
            throw new Error(`HF Error: ${response.statusText}`);
          }

          const blob = await response.blob();
          const localVideoUrl = URL.createObjectURL(blob);

          vidTag.src = localVideoUrl;
          loadingText.style.display = 'none';
          vidTag.style.display = 'block';
          downloadBtn.style.display = 'block';
          genBtn.disabled = false;

        } catch (err) {
          console.error(err);
          // Automatic fallback if Hugging Face model is loading or busy
          loadingText.innerText = "HF Model is starting... generating high-detail animated image instead!";
          const fallbackImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}%20cinematic%20motion&width=${width}&height=${height}&seed=${randomSeed}&model=flux&nologo=true`;

          imgTag.onload = () => {
            loadingText.style.display = 'none';
            imgTag.style.display = 'block';
            downloadBtn.style.display = 'block';
            genBtn.disabled = false;
          };
          imgTag.src = fallbackImageUrl;
        }
      }
    }

    async function downloadMedia() {
      const type = document.getElementById('typeSelect').value;
      const mediaTag = (type === 'image' || document.getElementById('resultImage').style.display === 'block') 
        ? document.getElementById('resultImage') 
        : document.getElementById('resultVideo');
      
      if (!mediaTag.src) return;

      try {
        const response = await fetch(mediaTag.src);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `aetherisa-${Date.now()}.${mediaTag.tagName === 'IMG' ? 'png' : 'mp4'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(mediaTag.src, '_blank');
      }
    }
  </script>
</body>
</html>
