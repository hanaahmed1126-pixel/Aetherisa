<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherisa - AI Creation Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 550px;
      width: 100%;
      border: 1px solid #334155;
    }
    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #38bdf8;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
    }
    
    label { font-size: 0.875rem; font-weight: 600; color: #94a3b8; display: block; margin-top: 1rem; margin-bottom: 0.25rem; }
    
    input[type="text"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid #38bdf8; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    
    button.action-btn {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 1.25rem;
      transition: background-color 0.2s;
    }
    button.action-btn:hover { background-color: #0369a1; }
    button.action-btn:disabled { background-color: #475569; cursor: not-allowed; }

    #downloadBtn {
      background-color: #10b981;
      display: none;
      margin-top: 0.75rem;
    }
    #downloadBtn:hover { background-color: #059669; }

    #mediaContainer {
      margin-top: 1.5rem;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px dashed #334155;
    }
    img { max-width: 100%; height: auto; border-radius: 8px; display: none; }
    .loading { display: none; color: #94a3b8; text-align: center; font-size: 0.9rem; padding: 1rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Aetherisa</h2>

    <label for="promptInput">Prompt Description</label>
    <input type="text" id="promptInput" placeholder="Describe what you want to create..." onkeypress="handleKeyPress(event)">

    <div class="grid">
      <div>
        <label for="typeSelect">Output Format</label>
        <select id="typeSelect">
          <option value="image">Still Photo</option>
          <option value="animation">Motion / Animation</option>
        </select>
      </div>
      <div>
        <label for="sizeSelect">Aspect Ratio</label>
        <select id="sizeSelect">
          <option value="512x512">Square (1:1)</option>
          <option value="768x512">Landscape (3:2)</option>
          <option value="512x768">Portrait (2:3)</option>
        </select>
      </div>
    </div>

    <button class="action-btn" id="genBtn" onclick="generateMedia()">Generate Media</button>

    <div id="mediaContainer">
      <p id="loadingText" class="loading">Aetherisa is creating your art...</p>
      <img id="resultImage" src="" alt="AI Output">
    </div>

    <button class="action-btn" id="downloadBtn" onclick="downloadMedia()">Download Output</button>
  </div>

  <script>
    function handleKeyPress(event) {
      if (event.key === 'Enter') generateMedia();
    }

    async function generateMedia() {
      const prompt = document.getElementById('promptInput').value.trim();
      const type = document.getElementById('typeSelect').value;
      const imgTag = document.getElementById('resultImage');
      const loadingText = document.getElementById('loadingText');
      const genBtn = document.getElementById('genBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!prompt) {
        alert("Please enter a prompt first!");
        return;
      }

      imgTag.style.display = 'none';
      downloadBtn.style.display = 'none';
      loadingText.style.display = 'block';
      genBtn.disabled = true;

      const [width, height] = document.getElementById('sizeSelect').value.split('x');
      const randomSeed = Math.floor(Math.random() * 999999);

      let imageUrl = "";

      if (type === 'image') {
        loadingText.innerText = "Aetherisa is generating your photo...";
        imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&seed=${randomSeed}&model=flux&nologo=true`;
      } else {
        loadingText.innerText = "Aetherisa is rendering your motion animation...";
        imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + " dynamic motion looping animation cinema style")}?width=${width}&height=${height}&seed=${randomSeed}&model=turbo&nologo=true`;
      }

      imgTag.onload = () => {
        loadingText.style.display = 'none';
        imgTag.style.display = 'block';
        downloadBtn.style.display = 'block';
        genBtn.disabled = false;
      };

      imgTag.onerror = () => {
        loadingText.innerText = "Failed to render. Please try again!";
        genBtn.disabled = false;
      };

      imgTag.src = imageUrl;
    }

    async function downloadMedia() {
      const img = document.getElementById('resultImage');
      if (!img.src) return;

      try {
        const response = await fetch(img.src);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `aetherisa-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(img.src, '_blank');
      }
    }
  </script>
</body>
</html>
